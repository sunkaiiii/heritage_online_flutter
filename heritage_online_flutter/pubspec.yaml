name: heritage_online_flutter
description: Heritage Online Flutter Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 网络请求
  dio: ^5.4.0

  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # 本地存储
  shared_preferences: ^2.2.2

  # JSON 序列化
  json_annotation: ^4.9.0

  # 路由
  go_router: ^13.1.0

  # 国际化
  intl: any

  # 图片加载
  cached_network_image: ^3.3.1

  # URL 打开
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码风格
  flutter_lints: ^6.0.0

  # JSON 序列化生成
  json_serializable: ^6.7.1
  build_runner: ^2.4.8

  # Riverpod 代码生成
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  # 本地化资源
  generate: true

  assets:
    - assets/images/
